# Щоденна розсилка email-сповіщень системи моніторингу.
# Два UTC-розклади потрібні через зимовий/літній час у Europe/Kyiv.
# Скрипт сам пропускає запуск, який не припадає на 08:00–08:59 за Києвом.
#
# Необхідні GitHub Secrets:
#   SUPABASE_URL, SUPABASE_KEY
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM (опційно)

name: Email-сповіщення моніторингу

on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовий прогін без реальної відправки (1 = так)"
        default: "1"
      force_run:
        description: "Дозволити ручний запуск поза 08:00–08:59 за Києвом (1 = так)"
        default: "1"

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: python -m pip install --requirement requirements.txt

      - name: Розіслати сповіщення
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATIONS_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          NOTIFICATIONS_FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
        run: python scripts/send_notifications.py
