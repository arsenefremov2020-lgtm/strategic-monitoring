[client]
showSidebarNavigation = false

[theme]
# Єдиний, приємно-синій/прозоро-блакитний фон для всіх полів
# (інпутів, селектів, випадних списків) і чорний жирний текст у них —
# щоб текст у фільтрах/формах був чітко видимий (виправлення після
# тестування: поля стали або прозорими, або синіми з надто сірим,
# нежирним текстом). НЕ стосується st.data_editor на "Моніторинг
# виконання" — там власний, окремо заданий стиль (див. CSS сторінки).
base = "light"
primaryColor = "#005BBB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF2FF"
textColor = "#0F172A"
font = "sans serif"
