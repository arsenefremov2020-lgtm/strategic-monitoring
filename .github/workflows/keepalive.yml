# Анти-сон для Streamlit Community Cloud.
# Тимчасовий засіб до переїзду системи на постійний хостинг.
# Workflow має бути червоним, якщо застосунок справді недоступний.
#
# Необхідний GitHub Secret:
#   APP_URL — повна адреса застосунку, напр. https://xxxx.streamlit.app

name: Підтримка застосунку активним

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Перевірити доступність застосунку
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Спроба ${attempt}/3"
            if curl --fail --silent --show-error --location \
                 --output /dev/null \
                 --write-out "HTTP %{http_code}, %{time_total}s\n" \
                 --connect-timeout 15 \
                 --max-time 60 \
                 "${{ secrets.APP_URL }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 20
            fi
          done
          echo "Застосунок не відповів після трьох спроб." >&2
          exit 1

  codex-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build audit report
        shell: bash
        run: |
          mkdir -p audit
          {
            echo '=== OLD APPROVAL SYMBOL REFERENCES ==='
            grep -RInE 'APPROVAL_SCHEMES|DEFAULT_SCHEME|SUBMITTER_SELF_APPROVAL_SCHEME|scheme_options_for_|scheme_name_for_roles|roles_with_recorded_decisions|coordinator_scheme_tail_roles|append_final_coordinator_after_head_edit|next_stage_role_options|ROLE_RANK|_approval_role_rank|_VERTICAL_APPROVAL_ROLES|build_chain\(' . --exclude-dir=.git --exclude=codex-part1-audit.yml || true
            echo
            echo '=== OBSOLETE RPC REFERENCES ==='
            grep -RIn 'transition_resubmit_head_edit_final_coordinator\|resubmit_head_edit_to_final_coordinator' . --exclude-dir=.git --exclude=codex-part1-audit.yml || true
            echo
            echo '=== RESUBMIT RPC DEFINITIONS/USES ==='
            grep -RIn 'transition_resubmit_request\|p_mode\|stage_edit' . --exclude-dir=.git --exclude=codex-part1-audit.yml || true
            echo
            echo '=== APPROVAL CONSTRAINT DEFINITIONS ==='
            grep -RIn 'chk_approval_status\|approval_status.*CHECK' . --exclude-dir=.git --exclude=codex-part1-audit.yml || true
          } > audit/audit.txt
          grep -RIl 'transition_resubmit_request' . --exclude-dir=.git --exclude=codex-part1-audit.yml | while read -r f; do
            mkdir -p "audit/files/$(dirname "$f")"
            cp "$f" "audit/files/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: codex-part1-audit
          path: audit
          if-no-files-found: error
