name: Apply sidebar navigation cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_sidebar_navigation_cleanup.yml

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove legacy sidebar navigation CSS from app.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          block = '''section[data-testid="stSidebar"] div[data-testid="stPageLink"] {
              width: 100% !important;
              display: block !important;
              margin-top: 3px !important;
              margin-bottom: 5px !important;
          }

          section[data-testid="stSidebar"] div[data-testid="stPageLink"] a {
              width: 100% !important;
              min-height: 36px !important;
              display: flex !important;
              align-items: center !important;
              justify-content: flex-start !important;

              background: rgba(255, 255, 255, 0.78) !important;
              color: #0f172a !important;

              border-radius: 9px !important;
              padding: 7px 10px !important;
              border: 1px solid rgba(148, 163, 184, 0.35) !important;

              font-size: 14px !important;
              font-weight: 700 !important;
              letter-spacing: 0 !important;
              text-decoration: none !important;

              box-shadow: 0 1px 5px rgba(15, 23, 42, 0.05) !important;
          }

          section[data-testid="stSidebar"] div[data-testid="stPageLink"] a p {
              color: #0f172a !important;
              font-size: 14px !important;
              font-weight: 700 !important;
              margin: 0 !important;
          }

          section[data-testid="stSidebar"] div[data-testid="stPageLink"] a svg {
              color: #334155 !important;
              fill: #334155 !important;
          }

          section[data-testid="stSidebar"] div[data-testid="stPageLink"] a:hover {
              background: rgba(241, 245, 249, 0.95) !important;
              border-color: rgba(22, 163, 74, 0.35) !important;
              transform: none !important;
              filter: none !important;
          }

          '''
          if block not in text:
              raise SystemExit("Expected sidebar CSS block was not found in app.py")
          path.write_text(text.replace(block, "", 1), encoding="utf-8")
          PY

      - name: Commit app.py and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_sidebar_navigation_cleanup.yml
          git add app.py
          git commit -m "Move sidebar navigation styles to shared CSS"
          git push origin main
