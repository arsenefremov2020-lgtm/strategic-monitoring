# Анти-сон для Streamlit Community Cloud.
# Тимчасовий засіб до переїзду системи на постійний хостинг.
# Workflow має бути червоним, якщо застосунок справді недоступний.
#
# Необхідний GitHub Secret:
#   APP_URL — повна адреса застосунку, напр. https://xxxx.streamlit.app

name: Підтримка застосунку активним

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Перевірити доступність застосунку
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Спроба ${attempt}/3"
            if curl --fail --silent --show-error --location \
                 --output /dev/null \
                 --write-out "HTTP %{http_code}, %{time_total}s\n" \
                 --connect-timeout 15 \
                 --max-time 60 \
                 "${{ secrets.APP_URL }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 20
            fi
          done
          echo "Застосунок не відповів після трьох спроб." >&2
          exit 1

  codex-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source snapshot
        shell: bash
        run: |
          mkdir -p snapshot/core snapshot/config snapshot/pages snapshot/migrations
          cp core/approval_schemes.py snapshot/core/
          cp core/statuses.py snapshot/core/
          cp core/transitions.py snapshot/core/
          cp core/data_types.py snapshot/core/
          cp config/roles.py snapshot/config/
          cp 'pages/1_Моніторинг_виконання.py' snapshot/pages/
          cp 'pages/1_Мій_кабінет.py' snapshot/pages/
          cp 'pages/3_Адміністрування.py' snapshot/pages/
          cp 'pages/3_Мої_заявки.py' snapshot/pages/
          cp migrations/012_atomic_transitions.sql snapshot/migrations/
          cp migrations/018_head_edit_final_coordinator.sql snapshot/migrations/
      - uses: actions/upload-artifact@v4
        with:
          name: codex-part1-source-snapshot
          path: snapshot
          if-no-files-found: error
